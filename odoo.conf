[options]
; ============================================
; Server Configuration
; ============================================
admin_passwd = 2233
http_port = 8069
longpolling_port = 8072

; ============================================
; Database Configuration
; ============================================
db_host = localhost
db_port = 5432
db_user = odoo19
db_password = odoo19
db_name = False
db_maxconn = 64
db_template = template0

; List of databases to expose (leave empty for all)
; dbfilter = ^mydatabase$
list_db = True

; ============================================
; Paths (macOS specific)
; ============================================
; Addons path - adjust according to your installation
addons_path = /Users/dmprabath/dmprabath/Work/Aevon/odoo-19-community/odoo-19/custom_addons

; Data directory for filestore, sessions, etc.
;data_dir = /Users/yourusername/.local/share/Odoo

; ============================================
; Logging Configuration
; ============================================
;logfile = /Users/yourusername/.local/share/Odoo/odoo.log
log_level = info
log_handler = :INFO

; Log rotation settings
logrotate = True
log_db = False
log_db_level = warning

; ============================================
; Workers Configuration (for production)
; ============================================
; Enable multi-processing (recommended for production)
workers = 0
max_cron_threads = 2

; Memory limits (in MB)
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = -1

; ============================================
; Security Configuration
; ============================================
; Proxy mode (enable if behind nginx/apache)
proxy_mode = False

; Allowed CORS origins (comma separated)
; cors = http://localhost:3000,http://localhost:8080

; ============================================
; Email Configuration
; ============================================
; SMTP Server
smtp_server = smtp.gmail.com
smtp_port = 587
smtp_ssl = False
smtp_user = your-email@gmail.com
smtp_password = your-app-password

; Email settings
email_from = your-email@gmail.com

; ============================================
; Session & Security
; ============================================
; Session timeout (in seconds) - 7 days
session_timeout = 604800

; ============================================
; Translation & Localization
; ============================================
; Load translation files
; translate_modules = ['all']
without_demo = True

; ============================================
; Development Settings
; ============================================
; Enable developer mode
; dev_mode = reload,qweb,werkzeug,xml

; Auto-reload when Python files change
; dev_mode = reload

; ============================================
; Performance Tuning
; ============================================


; Server-wide modules (comma separated)
server_wide_modules = base,web

; ============================================
; File Upload Limits
; ============================================
; Maximum file upload size (in MB)
limit_file_upload = 100

; ============================================
; Gevent (for Odoo 19 compatibility)
; ============================================
; Use gevent for async operations
; gevent_port = 8072

; ============================================
; Additional Settings
; ============================================
; Timezone (optional, uses system timezone by default)
; timezone = Asia/Colombo

; Screenshot directory for reports
; screencasts = /Users/yourusername/.local/share/Odoo/screencasts

; ============================================
; SSL/HTTPS Configuration (if needed)
; ============================================
; Enable HTTPS
; xmlrpc_interface = 0.0.0.0
; netrpc = False
; secure_cert_file = /path/to/cert.pem
; secure_pkey_file = /path/to/privkey.pem
